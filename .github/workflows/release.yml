name: Package free macOS beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written to the app and artifact name
        required: true
        default: 1.0.0-beta.1
      build:
        description: Numeric CFBundle build number
        required: true
        default: "6"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Run tests
        run: swift test
      - name: Build and verify free distribution DMG
        env:
          ABIGENT_VERSION: ${{ inputs.version }}
          ABIGENT_BUILD: ${{ inputs.build }}
        run: scripts/release.sh
      - name: Upload package for manual GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: Abigent-${{ inputs.version }}-macOS-arm64-free
          if-no-files-found: error
          path: |
            dist/Abigent-${{ inputs.version }}-macOS-arm64.dmg
            dist/Abigent-${{ inputs.version }}-macOS-arm64.dmg.sha256
