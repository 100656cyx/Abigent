name: Package free macOS beta

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version written to the app and artifact name
        required: true
        default: 1.0.0-beta.2
      build:
        description: Numeric CFBundle build number
        required: true
        default: "7"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build and verify free distribution DMG
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          build="${INPUT_BUILD:-7}"
          ABIGENT_VERSION="$version" ABIGENT_BUILD="$build" Scripts/release.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abigent-macOS-arm64-free
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/*.dmg.sha256 \
            --title "Abigent ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
            --prerelease
